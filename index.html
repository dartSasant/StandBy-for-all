<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>StandBy</title>
<style>
  :root { --fg:#fff; --accent:#ff9f0a; }
  body.night { --fg:#d9372b; --accent:#d9372b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; transition:filter 1s; }
  body.night #stage { filter:brightness(.55); }
  #track { display:flex; height:100%; width:300%; transition:transform .4s ease; }
  .panel { width:calc(100% / 3); height:100%; display:flex;
    align-items:center; justify-content:center; position:relative; }
  .inner { transition:transform 3s; text-align:center; }

  /* Clock */
  #digital { font-size:26vw; font-weight:200; line-height:1; letter-spacing:-.03em; }
  #stacked { font-size:42vh; font-weight:700; line-height:.85; display:none; }
  #stacked span:last-child { color:var(--accent); display:block; }
  #analog { height:80vh; width:80vh; display:none; }
  #analog line { stroke-linecap:round; }
  .style-1 #digital { display:none; } .style-1 #stacked { display:block; }
  .style-2 #digital { display:none; } .style-2 #analog { display:block; }
  #date { margin-top:2vh; font-size:5vh; opacity:.7; }
  .style-2 #date { display:none; }

  /* Photos */
  #photo { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transition:opacity 1.2s; }
  #photo.show { opacity:1; }
  #photoMsg { opacity:.6; font-size:4vh; }

  /* Calendar */
  #cal { display:flex; align-items:center; gap:6vw; }
  #bigday { font-size:45vh; font-weight:700; line-height:1; color:var(--accent); }
  #monthName { font-size:6vh; font-weight:600; text-align:left; margin-bottom:1vh; }
  #grid { display:grid; grid-template-columns:repeat(7,7vh); gap:.8vh;
    font-size:3.6vh; text-align:center; }
  #grid .h { opacity:.5; font-size:2.8vh; }
  #grid .today { background:var(--accent); color:#000; border-radius:50%; font-weight:700; }

  /* UI */
  #bar { position:fixed; bottom:2vh; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; opacity:0; transition:opacity .4s; pointer-events:none; z-index:5; }
  #bar.on { opacity:1; pointer-events:auto; }
  #bar button { background:#222; color:#fff; border:0; border-radius:20px;
    padding:10px 16px; font-size:15px; }
  #dots { position:fixed; top:2vh; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:5; }
  #dots i { width:7px; height:7px; border-radius:50%; background:#fff; opacity:.25; }
  #dots i.on { opacity:.8; }
  #start { position:fixed; inset:0; background:#000; z-index:10; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:#fff; font-size:20px; text-align:center; padding:20px; }
  #start small { opacity:.5; font-size:14px; }
  #rotate { display:none; position:fixed; top:8px; width:100%; text-align:center;
    font-size:13px; opacity:.5; z-index:6; }
  @media (orientation:portrait) { #rotate { display:block; } }
</style>
</head>
<body>

<div id="start">
  <div>Tap to start</div>
  <small>Plug in your phone and rotate to landscape</small>
</div>
<div id="rotate">Rotate to landscape for best results</div>
<div id="dots"><i class="on"></i><i></i><i></i></div>

<div id="stage">
  <div id="track">
    <section class="panel"><div class="inner" id="clockInner">
      <div id="digital">--:--</div>
      <div id="stacked"><span>--</span><span>--</span></div>
      <svg id="analog" viewBox="-100 -100 200 200">
        <g id="ticks"></g>
        <line id="hh" x1="0" y1="0" x2="0" y2="-50" stroke="currentColor" stroke-width="6"/>
        <line id="mh" x1="0" y1="0" x2="0" y2="-75" stroke="currentColor" stroke-width="4"/>
        <line id="sh" x1="0" y1="10" x2="0" y2="-80" stroke="var(--accent)" stroke-width="2"/>
        <circle r="4" fill="var(--accent)"/>
      </svg>
      <div id="date"></div>
    </div></section>

    <section class="panel">
      <img id="photo" alt="">
      <div id="photoMsg">Tap, then "Photos" to add pictures</div>
    </section>

    <section class="panel"><div class="inner" id="cal">
      <div id="bigday"></div>
      <div><div id="monthName"></div><div id="grid"></div></div>
    </div></section>
  </div>
</div>

<div id="bar">
  <button id="bStyle">Clock style</button>
  <button id="bNight">Night: auto</button>
  <button id="bPhotos">Photos</button>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const store = {
  get:(k,d)=>{ try { return localStorage.getItem(k) ?? d } catch { return d } },
  set:(k,v)=>{ try { localStorage.setItem(k,v) } catch {} }
};

let idx = 0, style = +store.get('style',0), nightMode = store.get('night','auto');
let wake = null, photos = [], pi = 0;

/* ---------- Wake lock ---------- */
async function keepAwake(){
  try { wake = await navigator.wakeLock.request('screen'); } catch(e){ console.log(e); }
}
$('#start').addEventListener('click', () => {
  $('#start').style.display = 'none';
  keepAwake();
  if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('#start').style.display === 'none') keepAwake();
});

/* ---------- Swipe navigation ---------- */
function go(i){
  idx = Math.max(0, Math.min(2, i));
  $('#track').style.transform = `translateX(${-idx * 100 / 3}%)`;
  document.querySelectorAll('#dots i').forEach((d,n)=>d.classList.toggle('on', n===idx));
}
let sx = null;
$('#stage').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('#stage').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx+1);
  if (e.key === 'ArrowLeft') go(idx-1);
});

/* ---------- Controls ---------- */
let hideT;
$('#stage').addEventListener('click', () => {
  $('#bar').classList.add('on');
  clearTimeout(hideT);
  hideT = setTimeout(()=>$('#bar').classList.remove('on'), 3500);
});
function applyStyle(){
  $('#clockInner').className = 'inner style-' + style;
  store.set('style', style);
}
$('#bStyle').onclick = e => { e.stopPropagation(); style = (style+1)%3; applyStyle(); };
$('#bNight').onclick = e => {
  e.stopPropagation();
  nightMode = {auto:'on', on:'off', off:'auto'}[nightMode];
  store.set('night', nightMode); applyNight();
};
$('#bPhotos').onclick = e => { e.stopPropagation(); $('#file').click(); };

/* ---------- Night mode ---------- */
function applyNight(){
  const h = new Date().getHours();
  const on = nightMode === 'on' || (nightMode === 'auto' && (h >= 22 || h < 6));
  document.body.classList.toggle('night', on);
  $('#bNight').textContent = 'Night: ' + nightMode;
}

/* ---------- Clock ---------- */
const tk = $('#ticks');
for (let i = 0; i < 12; i++){
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('y1', i%3===0 ? -92 : -95); l.setAttribute('y2', -100);
  l.setAttribute('stroke','currentColor'); l.setAttribute('stroke-width', i%3===0 ? 3 : 1.5);
  l.setAttribute('transform', `rotate(${i*30})`); tk.appendChild(l);
}
const pad = n => String(n).padStart(2,'0');
function tick(){
