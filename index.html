<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>StandBy</title>
<style>
  :root { --fg:#fff; --accent:#fff; }
  body.night { --fg:#d9372b; --accent:#d9372b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; transition:filter 1s; }
  body.night #stage { filter:brightness(.55); }
  #track { display:flex; height:100%; width:200%; transition:transform .4s ease; }
  .panel { width:50%; height:100%; display:flex;
    align-items:center; justify-content:center; position:relative; }
  .inner { transition:transform 3s; }

  /* Clock + calendar side by side */
  #combo { display:flex; align-items:center; justify-content:center; gap:6vw; width:100%; }
  #clockWrap { display:flex; flex-direction:column; align-items:center; justify-content:center; }

  #digital { font-size:min(15vw,38vh); font-weight:200; line-height:1; letter-spacing:-.03em; }
  #stacked { font-size:min(40vh,18vw); font-weight:700; line-height:.85; display:none; }
  #stacked span:last-child { color:var(--accent); display:block; opacity:.7; }
  #analog { width:min(80vh,42vw); height:min(80vh,42vw); display:none; color:var(--fg); }
  .style-1 #digital { display:none; } .style-1 #stacked { display:block; }
  .style-2 #digital { display:none; } .style-2 #analog { display:block; }
  #date { margin-top:2vh; font-size:min(4.5vh,3vw); opacity:.7; text-align:center; }
  .style-2 #date { display:none; }

  /* Calendar widget */
  #calWrap { text-align:left; }
  #monthName { font-size:6.5vh; font-weight:700; letter-spacing:.02em; margin-bottom:2vh; }
  #grid { display:grid; grid-template-columns:repeat(7, 9vh); grid-auto-rows:9vh;
    font-size:5.2vh; font-weight:600; text-align:center; align-items:center; justify-items:center; }
  #grid > div { width:8vh; height:8vh; display:flex; align-items:center; justify-content:center; }
  #grid .h { opacity:.5; font-size:4.6vh; }
  #grid > div:nth-child(7n+1), #grid > div:nth-child(7n) { opacity:.5; }
  #grid .today { background:var(--fg); color:#000; border-radius:50%; opacity:1 !important; }

  /* Photos */
  #photo { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transition:opacity 1.2s; }
  #photo.show { opacity:1; }
  #photoMsg { opacity:.6; font-size:4vh; }

  /* UI */
  #bar { position:fixed; bottom:2vh; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; opacity:0; transition:opacity .4s; pointer-events:none; z-index:5; }
  #bar.on { opacity:1; pointer-events:auto; }
  #bar button { background:#222; color:#fff; border:0; border-radius:20px;
    padding:10px 16px; font-size:15px; }
  #dots { position:fixed; top:2vh; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:5; }
  #dots i { width:7px; height:7px; border-radius:50%; background:#fff; opacity:.25; }
  #dots i.on { opacity:.8; }
  #start { position:fixed; inset:0; background:#000; z-index:10; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:#fff; font-size:20px; text-align:center; padding:20px; }
  #start small { opacity:.5; font-size:14px; }
  #rotate { display:none; position:fixed; top:8px; width:100%; text-align:center;
    font-size:13px; opacity:.5; z-index:6; }

  /* Portrait fallback: stack clock above calendar */
  @media (orientation:portrait) {
    #rotate { display:block; }
    #combo { flex-direction:column; gap:4vh; }
    #analog { width:70vw; height:70vw; }
    #digital { font-size:26vw; }
    #stacked { font-size:30vw; }
    #monthName { font-size:6vw; margin-bottom:1vh; }
    #grid { grid-template-columns:repeat(7, 10vw); grid-auto-rows:7vw; font-size:4vw; }
    #grid > div { width:7vw; height:7vw; }
    #grid .h { font-size:3.6vw; }
  }
</style>
</head>
<body>

<div id="start">
  <div>Tap to start</div>
  <small>Plug in your phone and rotate to landscape</small>
</div>
<div id="rotate">Rotate to landscape for best results</div>
<div id="dots"><i class="on"></i><i></i></div>

<div id="stage">
  <div id="track">
    <section class="panel"><div class="inner" id="combo">
      <div id="clockWrap" class="style-2">
        <div id="digital">--:--</div>
        <div id="stacked"><span>--</span><span>--</span></div>
        <svg id="analog" viewBox="-100 -100 200 200">
          <g id="ticks"></g>
          <g id="nums"></g>
          <g id="hh" stroke="currentColor" stroke-linecap="round">
            <line x1="0" y1="0" x2="0" y2="-20" stroke-width="2.5"/>
            <line x1="0" y1="-18" x2="0" y2="-46" stroke-width="7"/>
          </g>
          <g id="mh" stroke="currentColor" stroke-linecap="round">
            <line x1="0" y1="0" x2="0" y2="-22" stroke-width="2.5"/>
            <line x1="0" y1="-20" x2="0" y2="-78" stroke-width="5.5"/>
          </g>
          <g id="sh" stroke="currentColor" stroke-linecap="round">
            <line x1="0" y1="14" x2="0" y2="-84" stroke-width="1.5" opacity=".75"/>
          </g>
          <circle r="5.5" fill="#000" stroke="currentColor" stroke-width="2.5"/>
          <circle r="1.5" fill="currentColor"/>
        </svg>
        <div id="date"></div>
      </div>
      <div id="calWrap">
        <div id="monthName"></div>
        <div id="grid"></div>
      </div>
    </div></section>

    <section class="panel">
      <img id="photo" alt="">
      <div id="photoMsg">Tap, then "Photos" to add pictures</div>
    </section>
  </div>
</div>

<div id="bar">
  <button id="bStyle">Clock style</button>
  <button id="bNight">Night: auto</button>
  <button id="bPhotos">Photos</button>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const store = {
  get:(k,d)=>{ try { return localStorage.getItem(k) ?? d } catch { return d } },
  set:(k,v)=>{ try { localStorage.setItem(k,v) } catch {} }
};

// Clock style: 0 = digital, 1 = stacked, 2 = analog (default)
let idx = 0, style = +store.get('style',2), nightMode = store.get('night','auto');
let wake = null, photos = [], pi = 0;

/* ---------- Wake lock ---------- */
async function keepAwake(){
  try { wake = await navigator.wakeLock.request('screen'); } catch(e){ console.log(e); }
}
$('#start').addEventListener('click', () => {
  $('#start').style.display = 'none';
  keepAwake();
  if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('#start').style.display === 'none') keepAwake();
});

/* ---------- Swipe navigation ---------- */
function go(i){
  idx = Math.max(0, Math.min(1, i));
  $('#track').style.transform = `translateX(${-idx * 50}%)`;
  document.querySelectorAll('#dots i').forEach((d,n)=>d.classList.toggle('on', n===idx));
}
let sx = null;
$('#stage').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('#stage').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx+1);
  if (e.key === 'ArrowLeft') go(idx-1);
});

/* ---------- Controls ---------- */
let hideT;
$('#stage').addEventListener('click', () => {
  $('#bar').classList.add('on');
  clearTimeout(hideT);
  hideT = setTimeout(()=>$('#bar').classList.remove('on'), 3500);
});
function applyStyle(){
  $('#clockWrap').className = 'style-' + style;
  store.set('style', style);
}
$('#bStyle').onclick = e => { e.stopPropagation(); style = (style+1)%3; applyStyle(); };
$('#bNight').onclick = e => {
  e.stopPropagation();
  nightMode = {auto:'on', on:'off', off:'auto'}[nightMode];
  store.set('night', nightMode); applyNight();
};
$('#bPhotos').onclick = e => { e.stopPropagation(); $('#file').click(); };

/* ---------- Night mode ---------- */
function applyNight(){
  const h = new Date().getHours();
  const on = nightMode === 'on' || (nightMode === 'auto' && (h >= 22 || h < 6));
  document.body.classList.toggle('night', on);
  $('#bNight').textContent = 'Night: ' + nightMode;
}

/* ---------- Analog clock face ---------- */
const NS = 'http://www.w3.org/2000/svg';
const tk = $('#ticks');
for (let i = 0; i < 60; i++){
  const l = document.createElementNS(NS, 'line');
  const big = i % 5 === 0;
  l.setAttribute('y1', big ? -88 : -92);
  l.setAttribute('y2', -98);
  l.setAttribute('stroke', 'currentColor');
  l.setAttribute('stroke-width', big ? 2.6 : 1.4);
  l.setAttribute('opacity', big ? 1 : .4);
  l.setAttribute('transform', `rotate(${i * 6})`);
  tk.appendChild(l);
}
const nm = $('#nums');
for (let n = 1; n <= 12; n++){
  const a = n * Math.PI / 6;
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', (68 * Math.sin(a)).toFixed(2));
  t.setAttribute('y', (-68 * Math.cos(a)).toFixed(2));
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('dominant-baseline', 'central');
  t.setAttribute('font-size', '21');
  t.setAttribute('font-weight', '600');
  t.setAttribute('fill', 'currentColor');
  t.textContent = n;
  nm.appendChild(t);
}

/* ---------- Clock ---------- */
const pad = n => String(n).padStart(2,'0');
function tick(){
  const d = new Date(), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const h12 = (h % 12) || 12;
  $('#digital').textContent = `${h12}:${pad(m)}`;
  const sp = $('#stacked').children; sp[0].textContent = pad(h12); sp[1].textContent = pad(m);
  $('#hh').setAttribute('transform', `rotate(${(h%12)*30 + m*.5})`);
  $('#mh').setAttribute('transform', `rotate(${m*6 + s*.1})`);
  $('#sh').setAttribute('transform', `rotate(${s*6})`);
  $('#date').textContent = d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  if (s === 0) { buildCalendar(); applyNight(); }
}

/* ---------- Calendar ---------- */
function buildCalendar(){
  const d = new Date(), y = d.getFullYear(), mo = d.getMonth();
  $('#monthName').textContent = d.toLocaleDateString([], {month:'long'}).toUpperCase();
  const g = $('#grid'); g.innerHTML = '';
  'SMTWTFS'.split('').forEach(c => g.insertAdjacentHTML('beforeend', `<div class="h">${c}</div>`));
  const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo+1, 0).getDate();
  for (let i = 0; i < first; i++) g.insertAdjacentHTML('beforeend','<div></div>');
  for (let n = 1; n <= days; n++)
    g.insertAdjacentHTML('beforeend', `<div class="${n===d.getDate()?'today':''}">${n}</div>`);
  // Fill to 6 rows so the widget size never jumps between months
  for (let i = first + days; i < 42; i++) g.insertAdjacentHTML('beforeend','<div></div>');
}

/* ---------- Photos ---------- */
$('#file').addEventListener('change', e => {
  photos = [...e.target.files].map(f => URL.createObjectURL(f));
  pi = 0; if (photos.length) { $('#photoMsg').style.display='none'; showPhoto(); go(1); }
});
function showPhoto(){
  if (!photos.length) return;
  const img = $('#photo');
  img.classList.remove('show');
  setTimeout(() => { img.src = photos[pi]; img.onload = () => img.classList.add('show'); }, 600);
}
setInterval(() => { if (photos.length > 1) { pi = (pi+1) % photos.length; showPhoto(); } }, 10000);

/* ---------- Burn-in drift ---------- */
setInterval(() => {
  const dx = (Math.random()*24 - 12), dy = (Math.random()*24 - 12);
  $('#combo').style.transform = `translate(${dx}px,${dy}px)`;
}, 60000);

/* ---------- Init ---------- */
applyStyle(); applyNight(); buildCalendar(); tick();
setInterval(tick, 1000);
</script>
</body>
</html>
